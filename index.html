<script>
"use strict";
const fl = Math.floor;
const $ = s => document.querySelector(s);

const isLeap = y => y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0);

/* ============ JDN ============ */
function toJDN(c, y, m, d) {
  if (c === 'g' || c === 'j') {
    const a = fl((14 - m) / 12);
    const yy = y + 4800 - a;
    const mm = m + 12 * a - 3;
    const j = d + fl((153 * mm + 2) / 5) + 365 * yy + fl(yy / 4);
    return c === 'g' ? j - fl(yy / 100) + fl(yy / 400) - 32045 : j - 32083;
  }
  if (c === 'h') return hebrewToJDN(y, m, d);
  if (c === 'c') return chineseToJDN(y, m, d);
  return toJDN('g', y, m, d);
}
function fromJDN(c, J) {
  if (c === 'g' || c === 'j') {
    let f = J + 1401;
    if (c === 'g') f += fl(fl((4 * J + 274277) / 146097) * 3 / 4) - 38;
    const e = 4 * f + 3;
    const g = fl((e % 1461) / 4);
    const h = 5 * g + 2;
    const D = fl((h % 153) / 5) + 1;
    const M = (fl(h / 153) + 2) % 12 + 1;
    return [fl(e / 1461) - 4716 + fl((14 - M) / 12), M, D];
  }
  if (c === 'h') return jdnToHebrew(J);
  if (c === 'c') return jdnToChinese(J);
  return fromJDN('g', J);
}

/* ============ Еврейский календарь ============ */
// Алгоритм Dershowitz & Reingold
function hebrewElapsedDays(y) {
  const monthsElapsed = fl((235 * y - 234) / 19);
  const partsElapsed = 12084 + 13753 * monthsElapsed;
  const day = monthsElapsed * 29 + fl(partsElapsed / 25920);
  if ((3 * (day + 1)) % 7 < 3) return day + 1;
  return day;
}
function hebrewYearLength(y) {
  return hebrewElapsedDays(y + 1) - hebrewElapsedDays(y);
}
function hebrewMonthDays(y, m) {
  if (m === 2 || m === 4 || m === 6 || m === 10 || m === 13) return 29;
  if (m === 12 && !hebrewLeap(y)) return 29;
  return 30;
}
function hebrewLeap(y) {
  return ((7 * y + 1) % 19) < 7;
}
const HEBREW_EPOCH = 347995; // JDN of 1 Tishrei 1
function hebrewToJDN(y, m, d) {
  let jdn = HEBREW_EPOCH + hebrewElapsedDays(y) + d - 1;
  const leap = hebrewLeap(y);
  // Порядок месяцев: Тишрей(1)...после Адара
  if (m < 7) {
    // от Тишрея до конца года
    for (let i = 7; i < m; i++) jdn += hebrewMonthDays(y, i);
    // + месяцы после Нисана
    for (let i = 1; i < 7; i++) jdn += hebrewMonthDays(y, i);
    for (let i = 7; i < m; i++) jdn -= hebrewMonthDays(y, i);
    // упрощение: считаем от Тишрея
    jdn = HEBREW_EPOCH + hebrewElapsedDays(y) + d - 1;
    for (let i = 7; i <= 12 + (leap ? 1 : 0); i++) jdn += hebrewMonthDays(y, i);
    for (let i = 1; i < m; i++) jdn += hebrewMonthDays(y, i);
  } else {
    for (let i = 7; i < m; i++) jdn += hebrewMonthDays(y, i);
  }
  return jdn;
}
function jdnToHebrew(J) {
  let y = fl((J - HEBREW_EPOCH) / 366) + 1;
  while (hebrewToJDN(y + 1, 7, 1) <= J) y++;
  while (hebrewToJDN(y, 7, 1) > J) y--;
  let m = 7;
  const leap = hebrewLeap(y);
  const lastMonth = leap ? 13 : 12;
  // Идём от Тишрея до конца года, потом от Нисана
  while (m <= lastMonth && hebrewToJDN(y, m, hebrewMonthDays(y, m)) < J) {
    if (m === 12 && !leap) m = 1;
    else if (m === lastMonth) m = 1;
    else m++;
    if (m === 7) break;
  }
  const d = J - hebrewToJDN(y, m, 1) + 1;
  return [y, m, d];
}

/* ============ Китайский солнечный календарь (24 сезона) ============ */
// 24 сезона: привязка к долготе Солнца (15° шаг). Приблизительная формула.
const JIEQI_ZH = ['立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒'];
const JIEQI_RU = ['Личунь (начало весны)','Юйшуй (дожди)','Цзинчжэ (пробуждение)','Чуньфэнь (равноденствие)','Цинмин (ясность)','Гуюй (хлебные дожди)','Лися (начало лета)','Сяомань (малое изобилие)','Манчжун (колошение)','Сячжи (солнцестояние)','Сяошу (малая жара)','Дашу (большая жара)','Лицю (начало осени)','Чушу (конец жары)','Байлу (белые росы)','Цюфэнь (равноденствие)','Ханьлу (холодные росы)','Шуанцзян (иней)','Лидун (начало зимы)','Сяосюэ (малый снег)','Дасюэ (большой снег)','Дунчжи (солнцестояние)','Сяохань (малый холод)','Дахань (большой холод)'];
const JIEQI_EN = ['Lichun (start of spring)','Yushui (rain water)','Jingzhe (awakening)','Chunfen (equinox)','Qingming (clear)','Guyu (grain rain)','Lixia (start of summer)','Xiaoman (grain full)','Mangzhong (grain in ear)','Xiazhi (solstice)','Xiaoshu (minor heat)','Dashu (major heat)','Liqiu (start of autumn)','Chushu (end of heat)','Bailu (white dew)','Qiufen (equinox)','Hanlu (cold dew)','Shuangjiang (frost)','Lidong (start of winter)','Xiaoxue (minor snow)','Daxue (major snow)','Dongzhi (solstice)','Xiaohan (minor cold)','Dahan (major cold)'];

const GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const GAN_RU = ['Цзя','И','Бин','Дин','У','Цзи','Гэн','Синь','Жэнь','Гуй'];
const ZHI_RU = ['Цзы','Чоу','Инь','Мао','Чэнь','Сы','У','Вэй','Шэнь','Ю','Сюй','Хай'];
const GAN_EN = ['Jia','Yi','Bing','Ding','Wu','Ji','Geng','Xin','Ren','Gui'];
const ZHI_EN = ['Zi','Chou','Yin','Mao','Chen','Si','Wu','Wei','Shen','You','Xu','Hai'];

// Китайский год определяется от Личунь (≈ 4 февраля)
// Дни от JDN(1 янв) переводятся в «день года» для МФК
// Аппроксимация: используем JDN → дни от 1 янв → номер дня в году
// МФК-день = (день года - 1) с учётом високосного дня

// Преобразование китайской даты (год ствола-ветви, номер сезона 1..24, день 1..15)
// в JDN. Для простоты считаем, что сезон длится ~15 дней.
function chineseToJDN(y, s, d) {
  // y — год ствола-ветви (циклический год, 0..59 в контексте интерфейса — год по МФК)
  // s — номер сезона 1..24
  // d — день 1..15 (условно)
  const baseYear = y;
  const startOfYear = toJDN('g', baseYear, 2, 4); // Личунь
  const dayInYear = (s - 1) * 15 + (d - 1);
  return startOfYear + dayInYear;
}
function jdnToChinese(J) {
  // Находим год: год, в котором Личунь <= J
  const [gy] = fromJDN('g', J);
  let y = gy;
  if (J < toJDN('g', gy, 2, 4)) y = gy - 1;
  const startOfYear = toJDN('g', y, 2, 4);
  const dayInYear = J - startOfYear;
  const s = fl(dayInYear / 15) + 1;
  const d = (dayInYear % 15) + 1;
  return [y, s, d];
}
function chineseYearCycle(y) {
  // 1984 = 甲子 (Jia-Zi), начало 60-летнего цикла
  const idx = ((y - 1984) % 60 + 60) % 60;
  return { gan: idx % 10, zhi: idx % 12, idx };
}

/* ============ МФК ============ */
function ifc(j) {
  const [y] = fromJDN('g', j);
  const doy = j - toJDN('g', y, 1, 1) + 1;
  const lp = isLeap(y);
  if (lp && doy === 169) return { y, k: 'leap', m: 6 };
  let n = doy;
  if (lp && doy > 169) n--;
  if (n === 365) return { y, k: 'year', m: 13 };
  return { y, k: 'n', m: fl((n - 1) / 28) + 1, d: (n - 1) % 28 + 1 };
}
function ifcJ(y, m, d, k) {
  const s = toJDN('g', y, 1, 1);
  const lp = isLeap(y);
  if (k === 'leap') return s + 168;
  if (k === 'year') return s + (lp ? 365 : 364);
  let n = (m - 1) * 28 + d;
  if (lp && n >= 169) n++;
  return s + n - 1;
}

/* ============ Переводы ============ */
const L = {
  ru: {
    ttl: 'Международный фиксированный календарь',
    t_in: 'Дата для перевода', t_yr: 'Год целиком',
    s1: 'Сол: июнь–июль', s2: 'Сол: июль–август',
    t_pk: 'Календарь', t_res: 'Результат', t_hl: 'Международные праздники года',
    cg: 'Григорианский', cj: 'Юлианский', cc: 'Китайский', ch: 'Еврейский',
    go: 'Перевести',
    bad: 'Такой даты нет в выбранном календаре',
    badyear: 'Год должен быть от 1 до 9999',
    badseason: 'Сезон 1–24, день 1–15',
    m: ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
    mg: ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
    im: ['Январь','Февраль','Март','Апрель','Май','Июнь','Сол','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
    img: ['января','февраля','марта','апреля','мая','июня','Сола','июля','августа','сентября','октября','ноября','декабря'],
    wd: ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'],
    ws: ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],
    pw: ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],
    leap: 'Високосный день', year: 'День года', noweek: 'вне недели',
    gr: 'Григорианский', ju: 'Юлианский', cn: 'Китайский солнечный', hb: 'Еврейский',
    legend: '● — праздник. Каждый месяц начинается с воскресенья; наведите на день, чтобы увидеть григорианскую дату.',
    note: 'Юлианские даты — через JDN. Китайский солнечный календарь: 24 сезона (节气) привязаны к долготе Солнца; для конвертации используется приближённая формула с Личунь (≈ 4 февраля). Еврейский календарь — алгоритм Д. и Р. (Dershowitz & Reingold).',
    hm: ['Тишрей','Хешван','Кислев','Тевет','Шват','Адар','Нисан','Ияр','Сиван','Таммуз','Ав','Элул','Адар II'],
    hml: ['Тишрея','Хешвана','Кислева','Тевета','Швата','Адара','Нисана','Ияра','Сивана','Таммуза','Ава','Элула','Адара II'],
    jq: JIEQI_RU,

const cache = {};
function hols(y) {
  if (cache[y]) return cache[y];
  const r = FIX.map(([m, d, k]) => ({ j: toJDN('g', y, m, d), k }));
  [y - 1, y].forEach(jy => {
    const j = toJDN('j', jy, 12, 25);
    if (fromJDN('g', j)[0] === y) r.push({ j, k: 'orx' });
  });
  let a = y % 19, b = fl(y / 100), c = y % 100, d = fl(b / 4), e = b % 4,
      f = fl((b + 8) / 25), g = fl((b - f + 1) / 3),
      h = (19 * a + b - d - g + 15) % 30,
      i = fl(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7,
      m = fl((a + 11 * h + 22 * l) / 451),
      n = h + l - 7 * m + 114;
  r.push({ j: toJDN('g', y, fl(n / 31), n % 31 + 1), k: 'ew' });
  let a2 = y % 4, b2 = y % 7, c2 = y % 19,
      d2 = (19 * c2 + 15) % 30,
      e2 = (2 * a2 + 4 * b2 - d2 + 34) % 7,
      n2 = d2 + e2 + 114;
  const oj = toJDN('j', y, fl(n2 / 31), n2 % 31 + 1);
  if (fromJDN('g', oj)[0] === y) r.push({ j: oj, k: 'eo' });
  r.sort((p, q) => p.j - q.j);
  return cache[y] = r;
}
const holAt = j => hols(fromJDN('g', j)[0]).filter(h => h.j === j);

  if (n.startsWith('ru')) return 'ru';

  if (n.startsWith('es')) return 'es';
  if (n.startsWith('zh')) return 'zh';
  return 'en';
};

function fmtI(j) {
  const o = ifc(j), t = T();
  return o.k === 'n'
    ? `${o.d} ${ord(t.img)[o.m - 1]} ${o.y}`
    : `${o.k === 'leap' ? t.leap : t.year}, ${o.y}`;
}
function fmtC(c, j) {
  const t = T();
  if (c === 'g' || c === 'j') {
    const [y, m, d] = fromJDN(c, j);
    return `${d} ${t.mg[m - 1]} ${y}`;
  }
  if (c === 'h') {
    const [y, m, d] = fromJDN('h', j);
    return `${d} ${t.hml[m - 1]} ${y}`;
  }
  if (c === 'c') {
    const [y, s, d] = fromJDN('c', j);
    const cyc = chineseYearCycle(y);
    return `${t.jq[s - 1]}, день ${d} · ${t.gan[cyc.gan]}${t.zhi[cyc.zhi]} (${y})`;
  }
  return '';
}

    const { y, m } = PV;
    $('#pt').textContent = `${m}. ${t.jq[m - 1]} · ${y}`;
    let h = '<div class="h">Пн</div><div class="h">Вт</div><div class="h">Ср</div><div class="h">Чт</div><div class="h">Пт</div><div class="h">Сб</div><div class="h">Вс</div>';
    for (let d = 1; d <= 15; d++) {
      const j = chineseToJDN(y, m, d);
      h += `<button type="button" data-d="${d}" class="${j === R ? 'sel' : ''} ${j === today() ? 'td' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
    }
    $('#pc').innerHTML = h;
    return;
  }
  if (c === 'h') {
    const { y, m } = PV;
    $('#pt').textContent = `${t.hm[m - 1]} ${y}`;
    const daysInMonth = hebrewMonthDays(y, m);
    const firstJ = hebrewToJDN(y, m, 1);
    const off = ((firstJ + 1) % 7 + 6) % 7;
    const tj = today();
    let h = t.pw.map(w => `<div class="h">${w}</div>`).join('') + '<span></span>'.repeat(off);
    for (let d = 1; d <= daysInMonth; d++) {
      const j = firstJ + d - 1;
      h += `<button type="button" data-d="${d}" class="${j === R ? 'sel' : ''} ${j === tj ? 'td' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
    }
    $('#pc').innerHTML = h;
    return;
  }
  // Григорианский и юлианский — как раньше
  const { y, m } = PV;
  const s = toJDN(c, y, m, 1);
  const nx = m === 12 ? toJDN(c, y + 1, 1, 1) : toJDN(c, y, m + 1, 1);
  const n = nx - s;
  const off = ((s + 1) % 7 + 6) % 7;
  const tj = today();
  const sj = toJDN(c, S.y, S.m, S.d);
  $('#pt').textContent = `${t.m[m - 1]} ${y} · ${c === 'g' ? t.gr : t.ju}`;
  let h = t.pw.map(w => `<div class="h">${w}</div>`).join('') + '<span></span>'.repeat(off);
  for (let d = 1; d <= n; d++) {
    const j = s + d - 1;
    h += `<button type="button" data-d="${d}" class="${j === sj ? 'sel' : ''} ${j === tj ? 'td' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
  }
  $('#pc').innerHTML = h;
}

function cellHTML(j, txt, extra) {
  const t = T();
  const hs = holAt(j);
  const title = `${fmtC('g', j)}${hs.length ? ' — ' + hs.map(q => t.H[q.k]).join(', ') : ''}`;
  return `<button type="button" data-j="${j}" class="${j === R ? 'sel' : ''} ${j === today() ? 'td' : ''} ${hs.length ? 'hol' : ''} ${extra || ''}" title="${title}">${txt}</button>`;
}

function grid() {
  const t = T(), { y, m } = IV, lp = isLeap(y);
  $('#it').textContent = `${ord(t.im)[m - 1]} ${y}`;
  let h = t.ws.map(w => `<div class="h">${w}</div>`).join('');
  for (let d = 1; d <= 28; d++) h += cellHTML(ifcJ(y, m, d, 'n'), d);
  if (m === 6 && lp) h += cellHTML(ifcJ(y, 0, 0, 'leap'), t.leap, 'x');
  if (m === 13) h += cellHTML(ifcJ(y, 0, 0, 'year'), t.year, 'x');
  $('#ic').innerHTML = h;
}

function yearGrid() {
  const t = T(), y = IV.y, lp = isLeap(y), nm = ord(t.im);
  $('#yt').textContent = y;
  let h = '';
  for (let m = 1; m <= 13; m++) {
    let c = t.ws.map(w => `<div class="h">${w[0]}</div>`).join('');
    for (let d = 1; d <= 28; d++) c += cellHTML(ifcJ(y, m, d, 'n'), d);
    if (m === 6 && lp) c += cellHTML(ifcJ(y, 0, 0, 'leap'), t.leap, 'x');
    if (m === 13) c += cellHTML(ifcJ(y, 0, 0, 'year'), t.year, 'x');
    h += `<div class="mm"><h3>${nm[m - 1]}</h3><div class="cal">${c}</div></div>`;
  }
  $('#yv').innerHTML = h;
}

function result() {
  const t = T(), o = ifc(R);
  $('#rb').textContent = fmtI(R);
  const wd = o.k === 'n' ? t.wd[(o.d - 1) % 7] : t.noweek;
  const lines = [
    wd,
    `${t.gr}: ${fmtC('g', R)}`,
    `${t.ju}: ${fmtC('j', R)}`,
    `${t.cn}: ${fmtC('c', R)}`,
    `${t.hb}: ${fmtC('h', R)}`
  ];
  $('#rs').innerHTML = lines.join('<br>');
  $('#rh').innerHTML = holAt(R).map(h => `<span class="tag">${t.H[h.k]}</span>`).join('');
  $('#hl').innerHTML = hols(o.y).map(h => {
    const short = fmtI(h.j).replace(/,?\s*\d{1,4}$/, '');
    return `<li data-j="${h.j}"><span>${t.H[h.k]}<small>${fmtC('g', h.j)}</small></span><b>${short}</b></li>`;
  }).join('');
}

function all() {
  head();
  picker();
  grid();
  yearGrid();
  result();
}

function show(j) {
  R = j;
  const o = ifc(j);
  IV = { y: o.y, m: o.m };
  result();
  grid();
  yearGrid();
  // Синхронизация пикера с выбранной датой
  if (S.c === 'g' || S.c === 'j') {
    const [gy, gm] = fromJDN(S.c, j);
    PV = { y: gy, m: gm };
  } else if (S.c === 'h') {
    const [hy, hm] = fromJDN('h', j);
    PV = { y: hy, m: hm };
  } else if (S.c === 'c') {
    const [cy, cs] = fromJDN('c', j);
    PV = { y: cy, m: cs };
  }
  picker();
}

function convert() {
  const c = S.c;
  const y = +$('#fy').value;
  const m = +$('#fm').value;
  const d = +$('#fd').value;
  const t = T();
  if (!(y >= 1 && y <= 9999)) { $('#er').textContent = t.badyear; return; }
  if (!(d >= 1)) { $('#er').textContent = t.bad; return; }
  if (c === 'c' && (m < 1 || m > 24 || d < 1 || d > 15)) { $('#er').textContent = t.badseason; return; }
  if (c === 'h' && (m < 1 || m > 13 || d > 30)) { $('#er').textContent = t.bad; return; }
  let j;
  try {
    j = toJDN(c, y, m, d);
  } catch (e) {
    $('#er').textContent = t.bad;
    return;
  }
  // Проверка через обратное преобразование для g/j/h
  if (c === 'g' || c === 'j' || c === 'h') {
    const b = fromJDN(c, j);
    if (c === 'h') {
      if (b[0] !== y || b[1] !== m || b[2] !== d) { $('#er').textContent = t.bad; return; }
    } else {
      if (b[0] !== y || b[1] !== m || b[2] !== d) { $('#er').textContent = t.bad; return; }
    }
  }
  $('#er').textContent = '';
  S = { c, y, m, d };
  PV = { y, m };
  picker();
  show(j);
}

/* ============ События ============ */
$('#go').onclick = convert;
$('#cg').onclick = () => { S.c = 'g'; S.m = 1; S.d = 1; S.y = Math.max(1, S.y); PV = { y: S.y, m: 1 }; head(); picker(); };
$('#cj').onclick = () => { S.c = 'j'; S.m = 1; S.d = 1; PV = { y: S.y, m: 1 }; head(); picker(); };
$('#cc').onclick = () => { S.c = 'c'; S.m = 1; S.d = 1; PV = { y: S.y, m: 1 }; head(); picker(); };
$('#ch').onclick = () => { S.c = 'h'; S.m = 7; S.d = 1; PV = { y: S.y, m: 7 }; head(); picker(); };

// Языковое меню
$('#bl').onclick = e => {
  e.stopPropagation();
  const menu = $('#lm');
  const open = menu.classList.toggle('open');
  $('#bl').setAttribute('aria-expanded', open ? 'true' : 'false');
};
$('#lm').onclick = e => {
  const item = e.target.closest('.lang-item');
  if (!item) return;
  lang = item.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  $('#lm').classList.remove('open');
  $('#bl').setAttribute('aria-expanded', 'false');
  all();
};
document.addEventListener('click', e => {
  if (!e.target.closest('.lang')) {
    $('#lm').classList.remove('open');
    $('#bl').setAttribute('aria-expanded', 'false');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    $('#lm').classList.remove('open');
    $('#bl').setAttribute('aria-expanded', 'false');
  }
});

$('#bs').onclick = () => {
  sol = sol === 'aug' ? 'jul' : 'aug';
  try { localStorage.setItem('sol', sol); } catch (e) {}
  head();
  result();
  grid();
  yearGrid();
};
$('#yp').onclick = () => { if (IV.y > 1) { IV.y--; yearGrid(); } };
$('#yn').onclick = () => { if (IV.y < 9999) { IV.y++; yearGrid(); } };
$('#yv').onclick = e => { const j = e.target.dataset.j; if (j) show(+j); };
$('#bt').onclick = () => {
  theme = dark() ? 'light' : 'dark';
  try { localStorage.setItem('theme', theme); } catch (e) {}
  head();
};
$('#pp').onclick = () => {
  if (PV.m === 1) { if (PV.y > 1) { PV = { y: PV.y - 1, m: (S.c === 'c' ? 24 : 12) }; } }
  else PV.m--;
  picker();
};
$('#pn').onclick = () => {
  const maxM = S.c === 'c' ? 24 : 12;
  if (PV.m === maxM) { if (PV.y < 9999) { PV = { y: PV.y + 1, m: 1 }; } }
  else PV.m++;
  picker();
};
$('#ip').onclick = () => {
  if (IV.m === 1) { if (IV.y > 1) { IV = { y: IV.y - 1, m: 13 }; } }
  else IV.m--;
  grid();
};
$('#in').onclick = () => {
  if (IV.m === 13) { if (IV.y < 9999) { IV = { y: IV.y + 1, m: 1 }; } }
  else IV.m++;
  grid();
};
$('#pc').onclick = e => {
  const d = e.target.dataset.d;
  if (!d) return;
  S = { ...S, y: PV.y, m: PV.m, d: +d };
  head();
  picker();
  convert();
};
$('#ic').onclick = e => { const j = e.target.dataset.j; if (j) show(+j); };
$('#hl').onclick = e => { const li = e.target.closest('li'); if (li) show(+li.dataset.j); };

all();
</script>
</body>
</html>

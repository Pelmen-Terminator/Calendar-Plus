<script>
"use strict";
/* ============================================================
   МЕЖДУНАРОДНЫЙ ФИКСИРОВАННЫЙ КАЛЕНДАРЬ — v1.6 (единый файл)
   ============================================================ */

const fl = Math.floor;
const $ = s => document.querySelector(s);
const mod = (a, n) => ((a % n) + n) % n;
const isLeap = y => y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0);

/* ============================================================
   JDN — общий знаменатель всех календарей
   ============================================================ */
function gregorianToJDN(y, m, d) {
  const a = fl((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  const j = d + fl((153 * mm + 2) / 5) + 365 * yy + fl(yy / 4);
  return j - fl(yy / 100) + fl(yy / 400) - 32045;
}
function julianToJDN(y, m, d) {
  const a = fl((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + fl((153 * mm + 2) / 5) + 365 * yy + fl(yy / 4) - 32083;
}
function jdnToGregorian(J) {
  let f = J + 1401 + fl(fl((4 * J + 274277) / 146097) * 3 / 4) - 38;
  const e = 4 * f + 3;
  const g = fl((e % 1461) / 4);
  const h = 5 * g + 2;
  const D = fl((h % 153) / 5) + 1;
  const M = (fl(h / 153) + 2) % 12 + 1;
  return [fl(e / 1461) - 4716 + fl((14 - M) / 12), M, D];
}
function jdnToJulian(J) {
  let f = J + 1401;
  const e = 4 * f + 3;
  const g = fl((e % 1461) / 4);
  const h = 5 * g + 2;
  const D = fl((h % 153) / 5) + 1;
  const M = (fl(h / 153) + 2) % 12 + 1;
  return [fl(e / 1461) - 4716 + fl((14 - M) / 12), M, D];
}

/* ============ Персидский (Solar Hijri) ============ */
function persianToJDN(y, m, d) {
  const epBase = y - (y >= 0 ? 474 : 473);
  const epYear = 474 + mod(epBase, 2820);
  return d +
    (m <= 7 ? (m - 1) * 31 : (m - 1) * 30 + 6) +
    fl((epYear * 682 - 110) / 2816) +
    (epYear - 1) * 365 +
    fl(epBase / 2820) * 1029983 +
    (1948320 - 1);
}
function jdnToPersian(J) {
  const depoch = J - persianToJDN(475, 1, 1);
  const cycle = fl(depoch / 1029983);
  const cyear = mod(depoch, 1029983);
  let ycycle;
  if (cyear === 1029982) ycycle = 2820;
  else {
    const aux1 = fl(cyear / 366);
    const aux2 = mod(cyear, 366);
    ycycle = fl((2134 * aux1 + 2816 * aux2 + 2815) / 1028522) + aux1 + 1;
  }
  let y = ycycle + 2820 * cycle + 474;
  if (y <= 0) y--;
  const yday = J - persianToJDN(y, 1, 1) + 1;
  const m = yday <= 186 ? Math.ceil(yday / 31) : Math.ceil((yday - 6) / 30);
  const d = J - persianToJDN(y, m, 1) + 1;
  return [y, m, d];
}
function persianMonthDays(y, m) { return m <= 6 ? 31 : (m <= 11 ? 30 : (isPersianLeap(y) ? 30 : 29)); }
function isPersianLeap(y) {
  return mod(((y - (y > 0 ? 474 : 473)) % 2820 + 474 + 38) * 682, 2816) < 682;
}

/* ============ Коптский ============ */
const COPTIC_EPOCH = 1824665;
function copticToJDN(y, m, d) {
  return COPTIC_EPOCH - 1 + 365 * (y - 1) + fl(y / 4) + 30 * (m - 1) + d;
}
function jdnToCoptic(J) {
  const y = fl((4 * (J - COPTIC_EPOCH) + 1463) / 1461);
  const m = fl((J - copticToJDN(y, 1, 1)) / 30) + 1;
  const d = J + 1 - copticToJDN(y, m, 1);
  return [y, m, d];
}
function copticMonthDays(y, m) {
  if (m < 13) return 30;
  return mod(y, 4) === 3 ? 6 : 5;
}

/* ============ Еврейский ============ */
function hebrewElapsedDays(y) {
  const monthsElapsed = fl((235 * y - 234) / 19);
  const partsElapsed = 12084 + 13753 * monthsElapsed;
  const day = monthsElapsed * 29 + fl(partsElapsed / 25920);
  if ((3 * (day + 1)) % 7 < 3) return day + 1;
  return day;
}
function hebrewLeap(y) { return mod(7 * y + 1, 19) < 7; }
function hebrewYearLength(y) { return hebrewElapsedDays(y + 1) - hebrewElapsedDays(y); }
function hebrewMonthDays(y, m) {
  if (m === 2 || m === 4 || m === 6 || m === 10 || m === 13) return 29;
  if (m === 12 && !hebrewLeap(y)) return 29;
  if (m === 8 && hebrewYearLength(y) % 10 === 5) return 29;
  if (m === 9 && hebrewYearLength(y) % 10 === 3) return 29;
  return 30;
}
const HEBREW_EPOCH = 347995;
function hebrewToJDN(y, m, d) {
  let jdn = HEBREW_EPOCH + hebrewElapsedDays(y) + d - 1;
  const leap = hebrewLeap(y);
  const lastMonth = leap ? 13 : 12;
  if (m < 7) {
    for (let i = 7; i <= lastMonth; i++) jdn += hebrewMonthDays(y, i);
    for (let i = 1; i < m; i++) jdn += hebrewMonthDays(y, i);
  } else {
    for (let i = 7; i < m; i++) jdn += hebrewMonthDays(y, i);
  }
  return jdn;
}
function jdnToHebrew(J) {
  let y = fl((J - HEBREW_EPOCH) / 366) + 1;
  let guard = 0;
  while (hebrewToJDN(y + 1, 7, 1) <= J && guard++ < 10000) y++;
  guard = 0;
  while (hebrewToJDN(y, 7, 1) > J && guard++ < 10000) y--;
  const leap = hebrewLeap(y);
  const lastMonth = leap ? 13 : 12;
  const order = [7,8,9,10,11,12];
  if (leap) order.push(13);
  order.push(1,2,3,4,5,6);
  let m = 7;
  for (const mm of order) {
    const days = hebrewMonthDays(y, mm);
    if (J < hebrewToJDN(y, mm, 1) + days) { m = mm; break; }
  }
  const d = J - hebrewToJDN(y, m, 1) + 1;
  return [y, m, d];
}

/* ============ Китайский солнечный ============ */
function chineseToJDN(y, s, d) {
  const startOfYear = gregorianToJDN(y, 2, 4);
  return startOfYear + (s - 1) * 15 + (d - 1);
}
function jdnToChinese(J) {
  const [gy] = jdnToGregorian(J);
  let y = gy;
  if (J < gregorianToJDN(gy, 2, 4)) y = gy - 1;
  const startOfYear = gregorianToJDN(y, 2, 4);
  const dayInYear = J - startOfYear;
  const s = mod(fl(dayInYear / 15), 24) + 1;
  const d = mod(dayInYear, 15) + 1;
  return [y, s, d];
}
function chineseYearCycle(y) {
  const idx = mod(y - 1984, 60);
  return { gan: idx % 10, zhi: idx % 12, idx };
}

/* ============ Индуистский ============ */
const HINDU_MONTHS_DAYS = [30, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 30];
const HINDU_EPOCH = 1749630;
function hinduIsLeap(y) { return ((y * 11 + 3) % 33) < 11; }
function hinduToJDN(y, m, d) {
  let jdn = HINDU_EPOCH;
  for (let yy = 1; yy < y; yy++) jdn += 365 + (hinduIsLeap(yy) ? 1 : 0);
  for (let mm = 1; mm < m; mm++) jdn += HINDU_MONTHS_DAYS[mm - 1];
  if (m === 1 && hinduIsLeap(y)) jdn += 1;
  return jdn + d - 1;
}
function jdnToHindu(J) {
  let y = 1;
  let guard = 0;
  while (hinduToJDN(y + 1, 1, 1) <= J && guard++ < 100000) y++;
  let rem = J - hinduToJDN(y, 1, 1);
  let m = 1;
  while (m < 12 && rem >= HINDU_MONTHS_DAYS[m - 1]) { rem -= HINDU_MONTHS_DAYS[m - 1]; m++; }
  return [y, m, rem + 1];
}

/* ============ Исламский ============ */
const ISLAMIC_EPOCH = 1948440;
function islamicToJDN(y, m, d) {
  return d + Math.ceil(29.5 * (m - 1)) + (y - 1) * 354 + fl((3 + 11 * y) / 30) + ISLAMIC_EPOCH - 1;
}
function jdnToIslamic(J) {
  let y = fl((30 * (J - ISLAMIC_EPOCH) + 10646) / 10631);
  let guard = 0;
  while (islamicToJDN(y + 1, 1, 1) <= J && guard++ < 10000) y++;
  guard = 0;
  while (islamicToJDN(y, 1, 1) > J && guard++ < 10000) y--;
  let m = 1;
  while (m < 12 && islamicToJDN(y, m + 1, 1) <= J) m++;
  const d = J - islamicToJDN(y, m, 1) + 1;
  return [y, m, d];
}
function islamicMonthDays(y, m) {
  return islamicToJDN(y, m + 1, 1) - islamicToJDN(y, m, 1);
}

/* ============ Единый конвертор ============ */
function toJDN(c, y, m, d) {
  switch (c) {
    case 'g': return gregorianToJDN(y, m, d);
    case 'j': return julianToJDN(y, m, d);
    case 'h': return hebrewToJDN(y, m, d);
    case 'c': return chineseToJDN(y, m, d);
    case 'i': return hinduToJDN(y, m, d);
    case 'm': return islamicToJDN(y, m, d);
    case 'p': return persianToJDN(y, m, d);
    case 'k': return copticToJDN(y, m, d);
  }
  return gregorianToJDN(y, m, d);
}
function fromJDN(c, J) {
  switch (c) {
    case 'g': return jdnToGregorian(J);
    case 'j': return jdnToJulian(J);
    case 'h': return jdnToHebrew(J);
    case 'c': return jdnToChinese(J);
    case 'i': return jdnToHindu(J);
    case 'm': return jdnToIslamic(J);
    case 'p': return jdnToPersian(J);
    case 'k': return jdnToCoptic(J);
  }
  return jdnToGregorian(J);
}

/* ============================================================
   МФК — Международный фиксированный календарь
   ============================================================ */
function ifcFromJDN(J) {
  const [y] = jdnToGregorian(J);
  const doy = J - gregorianToJDN(y, 1, 1) + 1;
  const lp = isLeap(y);
  if (lp && doy === 169) return { y, k: 'leap', m: 6 };
  let n = doy;
  if (lp && doy > 169) n--;
  if (n === 365) return { y, k: 'year', m: 13 };
  return { y, k: 'n', m: fl((n - 1) / 28) + 1, d: (n - 1) % 28 + 1 };
}
function ifcMonthJ(y, m, d) {
  const s = gregorianToJDN(y, 1, 1);
  const lp = isLeap(y);
  let n = (m - 1) * 28 + d;
  if (lp && n >= 169) n++;
  return s + n - 1;
}

/* ============================================================
   ПРАЗДНИКИ
   ============================================================ */
const FIX = [
  [1,1,'ny'],[1,27,'holocaust'],[1,28,'peace2'],
  [2,14,'val'],[2,21,'lang'],
  [3,8,'w'],[3,22,'water'],
  [4,7,'health'],[4,12,'space'],[4,22,'earth'],[4,23,'book'],
  [5,1,'lab'],[5,8,'vdayW'],[5,8,'mother'],[5,9,'vdayE'],
  [6,1,'ch'],[6,5,'env'],[6,8,'oceans'],[6,15,'father'],
  [8,12,'youth'],
  [9,21,'peace'],
  [10,1,'music'],[10,1,'elderly'],[10,5,'teach'],[10,9,'post'],[10,24,'un'],
  [11,19,'men'],[11,21,'tv'],
  [12,3,'disab'],[12,5,'vol'],[12,10,'hr'],[12,11,'mountains'],[12,18,'migrants'],[12,25,'xm'],[12,31,'ev']
];

const cache = {};
function hols(y) {
  if (cache[y]) return cache[y];
  const r = FIX.map(([m, d, k]) => ({ j: gregorianToJDN(y, m, d), k }));
  [y - 1, y].forEach(jy => {
    const j = julianToJDN(jy, 12, 25);
    if (jdnToGregorian(j)[0] === y) r.push({ j, k: 'orx' });
  });
  let a = y % 19, b = fl(y / 100), c = y % 100, d = fl(b / 4), e = b % 4,
      f = fl((b + 8) / 25), g = fl((b - f + 1) / 3),
      h = (19 * a + b - d - g + 15) % 30,
      i = fl(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7,

function detectLang() {
  const n = (navigator.language || '').toLowerCase();
  if (n.startsWith('ru')) return 'ru';
  if (n.startsWith('uk')) return 'uk';
  if (n.startsWith('de')) return 'de';
  if (n.startsWith('it')) return 'it';
  if (n.startsWith('id') || n.startsWith('in')) return 'id';
  if (n.startsWith('pt')) return 'pt';
  if (n.startsWith('es')) return 'es';
  if (n.startsWith('zh')) return 'zh';
  if (n.startsWith('ja')) return 'ja';
  if (n.startsWith('ko')) return 'ko';
  if (n.startsWith('hi')) return 'hi';
  if (n.startsWith('he') || n.startsWith('iw')) return 'he';
  if (n.startsWith('ar')) return 'ar';
  if (n.startsWith('tr')) return 'tr';
  if (n.startsWith('pl')) return 'pl';
  if (n.startsWith('fr')) return 'fr';
  return 'en';
}

const dark = () => theme ? theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
const today = () => {
  const n = new Date();
  return gregorianToJDN(n.getFullYear(), n.getMonth() + 1, n.getDate());
};

}

function fmtIFC(j) {
  const o = ifcFromJDN(j);
  const t = T();
  const img = sol === 'aug'
    ? t.img.map((_, i) => t.img[i === 6 ? 7 : i === 7 ? 6 : i])
    : t.img;
  return o.k === 'n'
    ? `${o.d} ${img[o.m - 1]} ${o.y}`
    : `${o.k === 'leap' ? t.leap : t.year}, ${o.y}`;
}
function fmtCal(c, j) {
  const t = T();
  const [y, m, d] = fromJDN(c, j);
  if (c === 'g' || c === 'j') return `${d} ${t.mg[m - 1]} ${y}`;
  if (c === 'h') return `${d} ${t.hml[m - 1]} ${y}`;
  if (c === 'c') return `${t.jq[m - 1]}, ${d}`;
  if (c === 'i') return `${d} ${t.iml[m - 1]} ${y}`;
  if (c === 'm') return `${d} ${t.isml[m - 1]} ${y}`;
  if (c === 'p') return `${d} ${t.pml[m - 1]} ${y}`;
  if (c === 'k') return `${d} ${t.kml[m - 1]} ${y}`;
  return '';
}

function buildMonthOptions() {
  const t = T();
  const sel = $('#fm');
  const cur = S.m;
  let names;
  if (S.c === 'h') {
    const leap = hebrewLeap(S.y);
    names = t.hm.slice(0, leap ? 13 : 12);
  } else if (S.c === 'c') {
    names = t.jq.map((n, i) => `${i + 1}. ${n}`);
  } else if (S.c === 'i') {
    names = t.im2;
  } else if (S.c === 'm') {
    names = t.ism;
  } else if (S.c === 'p') {
    names = t.pm;
  } else if (S.c === 'k') {
    names = t.km;
  } else {
    names = t.m;
  }
  sel.innerHTML = names.map((n, i) => `<option value="${i + 1}">${n}</option>`).join('');
  if (+sel.value !== cur) sel.value = cur;
}

function weekHeader(t) {
  return t.pw.map(w => `<div class="h">${w}</div>`).join('');
}

function picker() {
  const t = T();
  const c = S.c;
  const cal = $('#pc');
  const cur = LANGS.find(l => l.code === lang);
  cal.setAttribute('dir', cur.dir);
  if (c === 'c') {
    const { y, m } = PV;
    $('#pt').textContent = `${m}. ${t.jq[m - 1]} · ${y}`;
    let h = weekHeader(t);
    for (let d = 1; d <= 15; d++) {
      const j = chineseToJDN(y, m, d);
      h += `<button type="button" data-d="${d}" class="${j === R ? 'sel' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
    }
    cal.innerHTML = h;
    return;
  }
  if (c === 'h') {
    const { y, m } = PV;
    $('#pt').textContent = `${t.hm[m - 1]} ${y}`;
    const days = hebrewMonthDays(y, m);
    const firstJ = hebrewToJDN(y, m, 1);
    const off = ((firstJ + 1) % 7 + 6) % 7;
    let h = weekHeader(t) + '<span></span>'.repeat(off);
    for (let d = 1; d <= days; d++) {
      const j = firstJ + d - 1;
      h += `<button type="button" data-d="${d}" class="${j === R ? 'sel' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
    }
    cal.innerHTML = h;
    return;
  }
  if (c === 'i') {
    const { y, m } = PV;
    $('#pt').textContent = `${t.im2[m - 1]} ${y}`;
    const days = HINDU_MONTHS_DAYS[m - 1];
    const firstJ = hinduToJDN(y, m, 1);
    const off = ((firstJ + 1) % 7 + 6) % 7;
    let h = weekHeader(t) + '<span></span>'.repeat(off);
    for (let d = 1; d <= days; d++) {
      const j = firstJ + d - 1;
      h += `<button type="button" data-d="${d}" class="${j === R ? 'sel' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
    }
    cal.innerHTML = h;
    return;
  }
  if (c === 'm') {
    const { y, m } = PV;
    $('#pt').textContent = `${t.ism[m - 1]} ${y}`;
    const days = islamicMonthDays(y, m);
    const firstJ = islamicToJDN(y, m, 1);
    const off = ((firstJ + 1) % 7 + 6) % 7;
    let h = weekHeader(t) + '<span></span>'.repeat(off);
    for (let d = 1; d <= days; d++) {
      const j = firstJ + d - 1;
      h += `<button type="button" data-d="${d}" class="${j === R ? 'sel' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
    }
    cal.innerHTML = h;
    return;
  }
  if (c === 'p') {
    const { y, m } = PV;
    $('#pt').textContent = `${t.pm[m - 1]} ${y}`;
    const days = persianMonthDays(y, m);
    const firstJ = persianToJDN(y, m, 1);
    const off = ((firstJ + 1) % 7 + 6) % 7;
    let h = weekHeader(t) + '<span></span>'.repeat(off);
    for (let d = 1; d <= days; d++) {
      const j = firstJ + d - 1;
      h += `<button type="button" data-d="${d}" class="${j === R ? 'sel' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
    }
    cal.innerHTML = h;
    return;
  }
  if (c === 'k') {
    const { y, m } = PV;
    $('#pt').textContent = `${t.km[m - 1]} ${y}`;
    const days = copticMonthDays(y, m);
    const firstJ = copticToJDN(y, m, 1);
    const off = ((firstJ + 1) % 7 + 6) % 7;
    let h = weekHeader(t) + '<span></span>'.repeat(off);
    for (let d = 1; d <= days; d++) {
      const j = firstJ + d - 1;
      h += `<button type="button" data-d="${d}" class="${j === R ? 'sel' : ''} ${holAt(j).length ? 'hol' : ''}">${d}</button>`;
    }
    cal.innerHTML = h;
    return;
  }
  // g / j
  const { y, m } = PV;
  const s = toJDN(c, y, m, 1);
  const nx = m === 12 ? toJDN(c, y + 1, 1, 1) : toJDN(c, y, m + 1, 1);
  const n = nx - s;
  const off = ((s + 1) % 7 + 6) % 7;
  $('#pt').textContent = `${t.m[m - 1]} ${y} · ${c === 'g' ? t.gr : t.ju}`;
  let h = weekHeader(t) + '<span></span>'.repeat(off);

    const j = s + d - 1;

  }
  cal.innerHTML = h;
}

function cellHTML(j, txt, extra) {
  const t = T();
  const hs = holAt(j);
  const title = `${fmtCal('g', j)}${hs.length ? ' — ' + hs.map(q => t.H[q.k]).join(', ') : ''}`;
  return `<button type="button" data-j="${j}" class="${j === R ? 'sel' : ''} ${j === today() ? 'td' : ''} ${hs.length ? 'hol' : ''} ${extra || ''}" title="${title}">${txt}</button>`;
}

function grid() {
  const t = T(), { y, m } = IV, lp = isLeap(y);
  const img = sol === 'aug' ? t.im.map((_, i) => t.im[i === 6 ? 7 : i === 7 ? 6 : i]) : t.im;
  $('#it').textContent = `${img[m - 1]} ${y}`;
  let h = t.ws.map(w => `<div class="h">${w}</div>`).join('');
  for (let d = 1; d <= 28; d++) h += cellHTML(ifcMonthJ(y, m, d), d);
  if (m === 6 && lp) h += cellHTML(gregorianToJDN(y, 1, 1) + 168, t.leap, 'x');
  if (m === 13) h += cellHTML(gregorianToJDN(y, 1, 1) + (lp ? 365 : 364), t.year, 'x');
  $('#ic').innerHTML = h;
}

function yearGrid() {
  const t = T(), y = IV.y, lp = isLeap(y);
  const img = sol === 'aug' ? t.im.map((_, i) => t.im[i === 6 ? 7 : i === 7 ? 6 : i]) : t.im;
  $('#yt').textContent = y;
  let h = '';
  for (let m = 1; m <= 13; m++) {
    let c = t.ws.map(w => `<div class="h">${w[0]}</div>`).join('');
    for (let d = 1; d <= 28; d++) c += cellHTML(ifcMonthJ(y, m, d), d);
    if (m === 6 && lp) c += cellHTML(gregorianToJDN(y, 1, 1) + 168, t.leap, 'x');
    if (m === 13) c += cellHTML(gregorianToJDN(y, 1, 1) + (lp ? 365 : 364), t.year, 'x');
    h += `<div class="mm"><h3>${img[m - 1]}</h3><div class="cal">${c}</div></div>`;
  }
  $('#yv').innerHTML = h;
}

function result() {
  const t = T(), o = ifcFromJDN(R);
  $('#rb').textContent = fmtIFC(R);
  const wd = o.k === 'n' ? t.wd[(o.d - 1) % 7] : t.noweek;
  const lines = [
    wd,
    `${t.gr}: ${fmtCal('g', R)}`,
    `${t.ju}: ${fmtCal('j', R)}`,
    `${t.cn}: ${fmtCal('c', R)}`,
    `${t.hb}: ${fmtCal('h', R)}`,
    `${t.in}: ${fmtCal('i', R)}`,
    `${t.is}: ${fmtCal('m', R)}`,
    `${t.pe}: ${fmtCal('p', R)}`,
    `${t.co}: ${fmtCal('k', R)}`
  ];
  $('#rs').innerHTML = lines.join('<br>');
  $('#rh').innerHTML = holAt(R).map(h => `<span class="tag">${t.H[h.k]}</span>`).join('');
  $('#hl').innerHTML = hols(o.y).map(h => {
    const short = fmtIFC(h.j).replace(/,?\s*\d{1,4}$/, '');
    return `<li data-j="${h.j}"><span>${t.H[h.k]}<small>${fmtCal('g', h.j)}</small></span><b>${short}</b></li>`;
  }).join('');
}

function refreshDiff() {
  const v1 = $('#d1').value;
  const v2 = $('#d2').value;
  if (!v1 || !v2) { $('#dr').textContent = ''; return; }
  const m1 = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v1);
  const m2 = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v2);
  if (!m1 || !m2) { $('#dr').textContent = ''; return; }
  const j1 = gregorianToJDN(+m1[1], +m1[2], +m1[3]);
  const j2 = gregorianToJDN(+m2[1], +m2[2], +m2[3]);
  const [a, b] = j1 <= j2 ? [j1, j2] : [j2, j1];
  const days = b - a;
  const weeks = fl(days / 7);
  const remDays = days % 7;
  const [y1, mo1, dd1] = jdnToGregorian(a);
  const [y2, mo2, dd2] = jdnToGregorian(b);
  let years = y2 - y1;
  let months = mo2 - mo1;
  let dd = dd2 - dd1;
  if (dd < 0) { months--; dd += 30; }
  if (months < 0) { years--; months += 12; }
  const o1 = ifcFromJDN(a);
  const o2 = ifcFromJDN(b);
  const ifcDays = (o2.y - o1.y) * 365 + (o2.m - o1.m) * 28 + ((o2.d || 1) - (o1.d || 1));
  const t = T();
  $('#dr').innerHTML = `${t.dDiff}: <b>${days}</b> ${t.dDays} (${weeks} ${t.dWeeks} ${remDays} ${t.dDays})<br>${t.dYMD}: <b>${years}</b> ${t.dYears}, <b>${months}</b> ${t.dMonths}, <b>${dd}</b> ${t.dDays}<br>${t.dIFC}: <b>${ifcDays}</b> ${t.dDays}`;
}

/* ============================================================
   URL-РОУТИНГ
   ============================================================ */
function readState() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return null;
  const parts = h.split('/');
  if (parts.length < 4) return null;
  return { c: parts[0], y: +parts[1], m: +parts[2], d: +parts[3] };
}
function writeState(c, y, m, d) {
  const h = `#/${c}/${y}/${m}/${d}`;
  if (location.hash !== h) history.replaceState(null, '', h);
}
async function copyText(text) {
  try {
    if (navigator.clipboard) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); document.body.removeChild(ta); return true; }
  catch (e) { document.body.removeChild(ta); return false; }
}
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ============================================================
   ICS-ЭКСПОРТ
   ============================================================ */
function downloadICS(year) {
  const t = T();
  const holidays = hols(year);
  const pad = n => String(n).padStart(2, '0');
  const jdnToICS = j => { const [y, m, d] = jdnToGregorian(j); return `${y}${pad(m)}${pad(d)}`; };
  const esc = s => s.replace(/[\\,;]/g, '\\$&').replace(/\n/g, '\\n');
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IFC Calendar//v1.6//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'
  ];
  const stamp = new Date().toISOString().replace(/[-:.]/g, '').slice(0, 15) + 'Z';
  for (const h of holidays) {
    lines.push(
      'BEGIN:VEVENT',
      `UID:ifc-${h.j}-${h.k}@ifc-calendar`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${jdnToICS(h.j)}`,
      `DTEND;VALUE=DATE:${jdnToICS(h.j + 1)}`,
      `SUMMARY:${esc(t.H[h.k])}`,
      'TRANSP:TRANSPARENT',
      'END:VEVENT'
    );
  }
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ifc-holidays-${year}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ ИЗ URL
   ============================================================ */
function initFromURL() {
  const st = readState();
  if (!st) return;
  if (!CAL_KEYS.includes(st.c)) return;
  try {
    S = { c: st.c, y: st.y, m: st.m, d: st.d };
    const j = toJDN(st.c, st.y, st.m, st.d);
    R = j;
    const o = ifcFromJDN(j);
    IV = { y: o.y, m: o.m };
    const [cy, cm] = fromJDN(st.c, j);
    PV = { y: cy, m: cm };
  } catch (e) {}
}

function all() {
  head(); picker(); grid(); yearGrid(); result(); refreshDiff();
  writeState(S.c, S.y, S.m, S.d);
}

function show(j) {
  R = j;
  const o = ifcFromJDN(j);
  IV = { y: o.y, m: o.m };
  result(); grid(); yearGrid();
  const [cy, cm] = fromJDN(S.c, j);
  PV = { y: cy, m: cm };
  picker();
  writeState(S.c, S.y, S.m, S.d);
}

function convert() {
  const c = S.c;
  const y = +$('#fy').value;
  const m = +$('#fm').value;
  const d = +$('#fd').value;
  const t = T();
  if (!(y >= 1 && y <= 9999)) { $('#er').textContent = t.badyear; return; }
  if (!(d >= 1)) { $('#er').textContent = t.bad; return; }
  if (c === 'c' && (m < 1 || m > 24 || d < 1 || d > 15)) { $('#er').textContent = t.badseason; return; }
  if (c === 'h' && (m < 1 || m > 13)) { $('#er').textContent = t.bad; return; }
  if (c === 'i' && (m < 1 || m > 12 || d > HINDU_MONTHS_DAYS[m - 1])) { $('#er').textContent = t.bad; return; }
  if (c === 'm' && (m < 1 || m > 12)) { $('#er').textContent = t.bad; return; }
  if (c === 'p' && (m < 1 || m > 12 || d > persianMonthDays(y, m))) { $('#er').textContent = t.bad; return; }
  if (c === 'k' && (m < 1 || m > 13 || d > copticMonthDays(y, m))) { $('#er').textContent = t.bad; return; }
  let j;
  try { j = toJDN(c, y, m, d); } catch (e) { $('#er').textContent = t.bad; return; }
  if (['g','j','h','i','m','p','k'].includes(c)) {
    const b = fromJDN(c, j);
    if (b[0] !== y || b[1] !== m || b[2] !== d) { $('#er').textContent = t.bad; return; }
  }
  $('#er').textContent = '';
  S = { c, y, m, d };
  PV = { y, m };
  picker();
  show(j);
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
$('#go').onclick = convert;

CAL_KEYS.forEach(k => {
  const el = $('#c' + k);
  if (!el) return;
  el.onclick = () => {
    S.c = k;
    if (k === 'h') { S.m = 7; S.d = 1; } else { S.m = 1; S.d = 1; }
    PV = { y: S.y, m: S.m };
    head(); picker();
    writeState(S.c, S.y, S.m, S.d);
  };
});

$('#bl').onclick = e => {
  e.stopPropagation();
  const menu = $('#lm');
  const open = menu.classList.toggle('open');
  $('#bl').setAttribute('aria-expanded', open ? 'true' : 'false');
};
$('#lm').onclick = e => {
  const item = e.target.closest('.lang-item');
  if (!item) return;
  lang = item.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  $('#lm').classList.remove('open');
  $('#bl').setAttribute('aria-expanded', 'false');
  all();
};
document.addEventListener('click', e => {
  if (!e.target.closest('.lang')) {
    $('#lm').classList.remove('open');
    $('#bl').setAttribute('aria-expanded', 'false');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    $('#lm').classList.remove('open');
    $('#bl').setAttribute('aria-expanded', 'false');
  }
});

$('#bs').onclick = () => {
  sol = sol === 'aug' ? 'jul' : 'aug';
  try { localStorage.setItem('sol', sol); } catch (e) {}
  head(); result(); grid(); yearGrid();
};
$('#yp').onclick = () => { if (IV.y > 1) { IV.y--; yearGrid(); } };
$('#yn').onclick = () => { if (IV.y < 9999) { IV.y++; yearGrid(); } };
$('#yv').onclick = e => { const j = e.target.dataset.j; if (j) show(+j); };
$('#bt').onclick = () => {
  theme = dark() ? 'light' : 'dark';
  try { localStorage.setItem('theme', theme); } catch (e) {}
  head();
};
$('#pp').onclick = () => {
  const maxM = S.c === 'c' ? 24 : (S.c === 'h' && hebrewLeap(PV.y) ? 13 : 12);
  if (PV.m === 1) { if (PV.y > 1) { PV = { y: PV.y - 1, m: maxM }; } }
  else PV.m--;
  picker();
};
$('#pn').onclick = () => {
  const maxM = S.c === 'c' ? 24 : (S.c === 'h' && hebrewLeap(PV.y) ? 13 : 12);
  if (PV.m === maxM) { if (PV.y < 9999) { PV = { y: PV.y + 1, m: 1 }; } }
  else PV.m++;
  picker();
};
$('#ip').onclick = () => {
  if (IV.m === 1) { if (IV.y > 1) { IV = { y: IV.y - 1, m: 13 }; } }
  else IV.m--;
  grid();
};
$('#in').onclick = () => {
  if (IV.m === 13) { if (IV.y < 9999) { IV = { y: IV.y + 1, m: 1 }; } }
  else IV.m++;
  grid();
};
$('#pc').onclick = e => {
  const d = e.target.dataset.d;
  if (!d) return;
  S = { ...S, y: PV.y, m: PV.m, d: +d };
  head(); picker(); convert();
};
$('#ic').onclick = e => { const j = e.target.dataset.j; if (j) show(+j); };
$('#hl').onclick = e => { const li = e.target.closest('li'); if (li) show(+li.dataset.j); };

$('#bcopy').onclick = async () => {
  const txt = $('#rb').textContent + ' | ' + $('#rs').textContent.replace(/<br>/g, ' · ').replace(/<[^>]+>/g, '');
  const ok = await copyText(txt);
  toast(ok ? T().copied : T().copyFail);
};
$('#bshare').onclick = async () => {
  writeState(S.c, S.y, S.m, S.d);
  if (navigator.share) {
    try { await navigator.share({ title: document.title, url: location.href }); return; }
    catch (e) {}
  }
  const ok = await copyText(location.href);
  toast(ok ? T().linkCopied : T().copyFail);
};
$('#bics').onclick = () => {
  downloadICS(ifcFromJDN(R).y);
  toast(T().icsDone);
};

$('#d1').value = new Date().toISOString().slice(0, 10);
$('#d2').value = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
$('#d1').onchange = refreshDiff;
$('#d2').onchange = refreshDiff;

window.addEventListener('hashchange', () => { initFromURL(); all(); });

/* ============================================================
   СТАРТ
   ============================================================ */
initFromURL();
all();
</script>
</body>
